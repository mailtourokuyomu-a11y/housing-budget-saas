<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>住宅購入・詳細家計診断</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}.wrap{max-width:760px;margin:auto;background:#fff;min-height:100vh;padding:22px 14px 50px}h1,h2,h3{color:#123b5d}.hero{padding:22px 6px}.badge{display:inline-block;background:#eef6fb;color:#123b5d;padding:5px 10px;border-radius:99px;font-weight:700;font-size:12px}.card{border:1px solid #dce4ea;border-radius:16px;padding:18px;margin:14px 0}.grid,.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid #cfd9e0;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#123b5d;color:white;font-size:16px;font-weight:800}.result{display:none}.judgement{padding:15px;border-radius:12px;font-size:19px;font-weight:800}.good{background:#eef8f2;color:#2f7d5b}.warn{background:#fff7ed;color:#9a5a00}.bad{background:#fff0ee;color:#9f1d14}.metric{padding:12px;background:#fafcfd;border:1px solid #dce4ea;border-radius:11px}.metric span{display:block;color:#5f6b76;font-size:12px}.metric strong{color:#123b5d;font-size:17px}.risk{padding:10px 12px;background:#fff7ed;border-radius:9px;margin:8px 0;font-size:14px}.scenario{padding:12px;background:#eef6fb;border-radius:10px;margin:8px 0}.note{font-size:12px;color:#5f6b76}.ai{padding:16px;background:#f4f8fb;border-left:4px solid #123b5d;border-radius:8px;white-space:pre-line}.gate{text-align:center;padding:50px 15px}@media(max-width:560px){.grid,.metrics{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><section id="gate" class="gate"><h1>決済を確認しています</h1><p>数秒お待ちください。</p></section><div id="paidContent" hidden>
<section class="hero"><span class="badge">決済確認済み・詳細診断</span><h1>住宅購入・詳細家計診断</h1><p>購入直後の手元資金、10年間の家計、金利上昇、大型支出、退職時のローン残高まで確認します。</p></section>
<form id="form"><section class="card"><h2>1. 家計・購入条件</h2><div class="grid">
<div class="field"><label>本人年齢</label><input id="age" type="number" value="40"></div><div class="field"><label>退職予定年齢</label><input id="retireAge" type="number" value="65"></div>
<div class="field"><label>手取り月収（万円）</label><input id="takehome" type="number" value="40" step=".1"></div><div class="field"><label>年間手取り賞与（万円）</label><input id="bonus" type="number" value="0"></div>
<div class="field"><label>預貯金（万円）</label><input id="savings" type="number" value="500"></div><div class="field"><label>基本生活費（月・万円）</label><input id="living" type="number" value="22" step=".1"></div>
<div class="field"><label>車関連費（月・万円）</label><input id="car" type="number" value="4" step=".1"></div><div class="field"><label>その他借入（月・万円）</label><input id="otherDebt" type="number" value="0" step=".1"></div>
<div class="field"><label>教育費（月・万円）</label><input id="education" type="number" value="0" step=".1"></div><div class="field"><label>老後積立（月・万円）</label><input id="retirementSave" type="number" value="0" step=".1"></div>
<div class="field"><label>希望住宅価格（万円）</label><input id="price" type="number" value="4500"></div><div class="field"><label>頭金（万円）</label><input id="down" type="number" value="300"></div>
<div class="field"><label>取得諸費用（万円）</label><input id="acquisition" type="number" value="250"></div><div class="field"><label>引越し・家具（万円）</label><input id="moving" type="number" value="30"></div>
<div class="field"><label>金利（%）</label><input id="rate" type="number" value="1.2" step=".01"></div><div class="field"><label>返済期間（年）</label><input id="years" type="number" value="35"></div></div></section>
<section class="card"><h2>2. 将来支出</h2><div class="grid">
<div class="field"><label>固定資産税（年・万円）</label><input id="propertyTax" type="number" value="15"></div><div class="field"><label>火災・地震保険（年・万円）</label><input id="insurance" type="number" value="10"></div>
<div class="field"><label>住宅修繕積立（年・万円）</label><input id="repairAnnual" type="number" value="12"></div><div class="field"><label>大型支出の年（1〜10年後）</label><input id="eventYear" type="number" value="5"></div>
<div class="field"><label>大型支出額（万円）</label><input id="eventAmount" type="number" value="200"></div><div class="field"><label>退職金見込み（万円・不明なら0）</label><input id="retirementLump" type="number" value="0"></div>
<div class="field"><label>退職金のうちローン返済に使える額（万円）</label><input id="retirementLoanUse" type="number" value="0"></div><div class="field"><label>教育費ピークの年（1〜10年後・不明なら0）</label><input id="educationPeakYear" type="number" value="0"></div>
<div class="field"><label>その年の追加教育費（万円・不明なら0）</label><input id="educationPeakAmount" type="number" value="0"></div></div></section>
<button class="btn" type="submit">詳細診断する</button></form>
<section id="result" class="card result"><h2>詳細診断結果</h2><div id="judgement" class="judgement"></div><div id="metrics" class="metrics"></div><h3>重要な確認点</h3><div id="risks"></div><h3>改善シナリオ</h3><div id="scenarios"></div><h3>AIによる総合分析</h3><div id="summary" class="ai"></div><p class="note">本結果はシミュレーションです。融資承認や将来の家計安全性を保証するものではありません。</p></section>
</div><script src="./premium.js"></script></main></body></html>
